services:
  rathole-server:
    build: .
    container_name: rathole-server
    restart: unless-stopped
    volumes:
      - ./run/server.toml:/app/config.toml:ro
    ports:
      - "2333:2333"       # tunnel control port
      - "9090:9090"       # REST API
      - "10000-14000:10000-14000"  # tunnel port range
    command: ["--server", "/app/config.toml"]
